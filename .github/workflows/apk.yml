name: Android APK

# 웹 파일이 바뀌면 APK를 다시 만들어 Releases(android-latest)에 올린다.
# 고정 다운로드 주소: https://github.com/GCODE77/english/releases/download/android-latest/English.apk
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'data/**', 'icons/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 웹 파일 복사 + Capacitor Android 프로젝트 생성
        run: |
          mkdir www
          cp -r index.html sw.js manifest.webmanifest data icons www/
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init English com.gcode77.english --web-dir www
          npx cap add android
          npx cap sync android

      - name: 앱 아이콘 적용
        run: |
          RES=android/app/src/main/res
          icon() { convert icons/icon-maskable-512.png -resize "$2x$2" "$RES/mipmap-$1/ic_launcher.png"; cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"; }
          icon mdpi 48; icon hdpi 72; icon xhdpi 96; icon xxhdpi 144; icon xxxhdpi 192
          # 적응형 아이콘: 가운데 66%에 아이콘을 넣고 바탕은 보라색
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            convert icons/icon-maskable-512.png -resize 66% -background none -gravity center -extent 512x512 "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#6B4EE6</color></resources>' > "$RES/values/ic_launcher_background.xml"

      - name: 서명 키 준비
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "저장소 시크릿의 서명 키를 사용한다(업데이트 설치 가능)."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 시크릿이 없어 빌드마다 새 키로 서명한다. 새 APK는 기존 앱 위에 덮어 설치되지 않는다."
          fi

      - name: 버전 코드 올리기 + APK 빌드
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk English.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest English.apk \
            --title "English 안드로이드 앱" \
            --notes "English.apk를 내려받아 설치하세요. (빌드 ${{ github.run_number }}, 커밋 ${GITHUB_SHA::7})"
