<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biz Vocab Quest</title>
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biz Vocab">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root{
    --indigo:#4F46E5; --indigo-d:#3730A3; --amber:#B45309;
    --ok:#15803D; --ok-bg:#DCFCE7; --no:#B91C1C; --no-bg:#FEE2E2;
    --ink:#0F172A; --muted:#475569; --cloud:#F4F5FD; --line:#E6E9F5;
    --surface:#FFFFFF; --chipbg:#E0E7FF; --chipink:#312E81;
    --shadow:0 1px 3px rgba(15,23,42,.07); --chippress:#C7D2FE; --toastbg:#0F172A;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --indigo:#A5B4FC; --indigo-d:#C7D2FE; --amber:#FBBF24;
      --ok:#4ADE80; --ok-bg:#123021; --no:#F87171; --no-bg:#3A1618;
      --ink:#F1F5F9; --muted:#A3AEC2; --cloud:#0E1017; --line:#232838;
      --surface:#171B26; --chipbg:#2A3150; --chipink:#C7D2FE;
      --shadow:0 1px 3px rgba(0,0,0,.4); --chippress:#3B4570; --toastbg:#2C3346;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--cloud); color:var(--ink); font-size:17px; line-height:1.6;
    font-family:-apple-system,"Noto Sans KR","Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  #app{max-width:520px; margin:0 auto; padding:18px 18px 32px;}
  h1{font-size:34px; font-weight:900; color:var(--indigo); margin:8px 0 4px; letter-spacing:-.5px}
  .sub{color:var(--muted); font-size:15px; margin-bottom:20px}
  .card{background:var(--surface); border-radius:22px; padding:20px; box-shadow:0 1px 3px rgba(17,24,39,.06)}
  .row{display:flex; align-items:center; justify-content:space-between}
  .stats{display:flex; justify-content:space-around; text-align:center}
  .stat b{display:block; font-size:24px; font-weight:900}
  .stat span{font-size:12px; color:var(--muted)}
  button{font-family:inherit; border:none; cursor:pointer}
  .primary{width:100%; min-height:60px; border-radius:20px; background:var(--indigo);
    color:#fff; font-size:19px; font-weight:800; margin-top:18px}
  .primary:active{background:var(--indigo-d)}
  .ghost{width:100%; min-height:52px; border-radius:18px; background:transparent;
    border:1.5px solid #D1D5DB; color:var(--muted); font-size:15px; font-weight:700; margin-top:10px}
  .link{background:none; color:var(--muted); font-size:14px; text-decoration:underline; padding:8px}
  .bar{height:12px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:8px}
  .qhead{position:sticky; top:0; z-index:20; background:var(--cloud); margin:0 -18px;
    padding:10px 18px 12px}
  .qhead .sc{display:flex; gap:16px; align-items:baseline}
  .qhead .sc em{font-style:normal; font-size:12px; font-weight:700; color:var(--muted); margin-right:5px}
  .qhead .sc b{font-size:20px; font-weight:900}
  .bar > i{display:block; height:100%; background:var(--indigo); border-radius:5px; transition:width .3s}
  .meta{font-size:14px; color:var(--muted); font-weight:700}
  .ipa{display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px;
    color:var(--ink); background:var(--line); border-radius:8px; padding:6px 11px; letter-spacing:.2px}
  .term{font-size:38px; font-weight:900; color:var(--indigo); line-height:1.15; word-break:break-word}
  .prompt{font-size:22px; font-weight:700; line-height:1.55}
  .speak{min-height:52px; padding:0 18px; border-radius:26px; background:var(--chipbg);
    color:var(--chipink); font-size:15px; font-weight:800; display:inline-flex;
    align-items:center; gap:8px; margin:6px 8px 0 0}
  .speak:active{background:var(--chippress)}
  .speak[disabled]{opacity:.4}
  .opt{width:100%; min-height:68px; text-align:left; background:var(--surface); border:2px solid var(--line);
    border-radius:18px; padding:17px 18px; font-size:18px; font-weight:700; color:var(--ink); margin-top:12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; transition:.15s}
  .opt:active{transform:scale(.985)}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); box-shadow:inset 5px 0 0 var(--ok)}
  .opt.wrong{background:var(--no-bg); border-color:var(--no); box-shadow:inset 5px 0 0 var(--no)}
  .opt.dim{opacity:.35}
  .mark{font-size:22px; font-weight:900}
  .fb{border-radius:20px; padding:18px; margin-top:18px}
  .fb.ok{background:var(--ok-bg)} .fb.no{background:var(--no-bg)}
  .fb h3{margin:0; font-size:21px; font-weight:900}
  .fb h3.ok{color:var(--ok)} .fb h3.no{color:var(--no)}
  .fb p{margin:10px 0 0; font-size:17px; line-height:1.7; color:var(--ink)}
  .fb .ko{color:var(--muted)}
  .notice{background:var(--line); border-radius:14px; padding:14px; font-size:14px;
    color:var(--muted); line-height:1.7; margin-top:16px}
  .wrongitem{background:var(--no-bg); border-radius:16px; padding:16px; margin-top:12px}
  .wrongitem b{font-size:20px; font-weight:900; color:var(--no)}
  .plus{color:var(--ok); font-weight:800; font-size:15px; margin-left:10px}
  .fire{color:var(--amber)}
  .install{width:100%; min-height:56px; border-radius:18px; background:var(--ok); color:#fff;
    font-size:16px; font-weight:800; margin-top:10px}
  .tabs{display:flex; gap:8px; margin:14px 0 12px}
  .tab{flex:1; min-height:46px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line);
    color:var(--muted); font-size:14px; font-weight:800}
  .tab.on{background:var(--indigo); border-color:var(--indigo); color:#fff}
  .search{width:100%; min-height:50px; border-radius:14px; border:1.5px solid var(--line);
    padding:0 16px; font-size:16px; font-family:inherit; background:var(--surface); color:var(--ink); margin-bottom:6px}
  .search:focus{outline:none; border-color:var(--indigo)}
  .item{background:var(--surface); border-radius:16px; padding:14px 16px; margin-top:10px}
  .item .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .item b{font-size:18px; font-weight:800; color:var(--indigo)}
  .badge{font-size:11px; font-weight:800; border-radius:999px; padding:4px 9px; white-space:nowrap}
  .b-new{background:var(--line); color:var(--muted)}
  .b-go{background:var(--chipbg); color:var(--chipink)}
  .b-ok{background:var(--ok-bg); color:var(--ok)}
  .b-bad{background:var(--no-bg); color:var(--no)}
  .item .ko{font-size:15px; margin-top:6px}
  .item .ex{font-size:15px; color:var(--muted); margin-top:6px; line-height:1.6}
  .miniSpeak{min-height:40px; padding:0 12px; border-radius:20px; background:var(--chipbg);
    color:var(--chipink); font-size:13px; font-weight:800; margin-top:10px}
  .empty{text-align:center; color:var(--muted); font-size:15px; line-height:1.7; padding:40px 20px}
  .chips{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .chip{flex:1 1 0; min-width:78px; min-height:52px; border-radius:14px; background:var(--surface);
    border:1.5px solid var(--line); color:var(--muted); font-size:14px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px}
  .chip small{font-size:12px; font-weight:600; opacity:.85}
  .chip.on{background:var(--indigo); border-color:var(--indigo); color:#fff}
  .chip.on small{opacity:.9}
  .label{font-size:13px; font-weight:800; color:var(--muted); margin-top:18px}
  .topic{display:inline-block; background:var(--chipbg); color:var(--indigo-d); border-radius:8px;
    padding:4px 10px; font-size:12px; font-weight:800}
  .tip{background:var(--surface); border-radius:12px; padding:13px 15px; margin-top:12px;
    font-size:15px; line-height:1.7; color:var(--ink); border-left:5px solid var(--indigo)}
  .speak.busy{background:var(--indigo); color:#fff}
  #toast{position:fixed; left:12px; right:12px; bottom:16px; margin:0 auto; max-width:496px;
    background:var(--toastbg); color:#fff; border-radius:14px; padding:14px 16px; font-size:14px;
    line-height:1.5; opacity:0; transform:translateY(12px); pointer-events:none;
    transition:.22s; z-index:99; box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #toast.show{opacity:1; transform:translateY(0)}
  .diag{width:100%; min-height:52px; border-radius:18px; background:var(--chipbg); color:var(--indigo-d);
    font-size:15px; font-weight:800; margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const WORDS = [

  {"id":"un_draft","term":"draft","meaningKo":"초안","pos":"명사","example":"I sent my first draft to the professor for early feedback.","exampleKo":"저는 교수님께 첫 초안을 보내 미리 피드백을 받았어요.","confusions":[{"id":"un_manuscript","note":"manuscript는 출판이나 투고용으로 제출하는 원고이고, draft는 고쳐 나가는 중간 단계의 초안이에요."},{"id":"un_outline","note":"outline은 항목만 적은 뼈대이고, draft는 문장으로 처음부터 끝까지 쓴 초안이에요."}],"level":1,"track":"univ"},
  {"id":"un_essay","term":"essay","meaningKo":"에세이, 소논문","pos":"명사","example":"The history course requires a five-page essay about the French Revolution.","exampleKo":"그 역사 수업은 프랑스 혁명에 관한 다섯 쪽짜리 에세이를 요구해요.","confusions":[{"id":"un_dissertation","note":"dissertation은 박사 등 학위를 받기 위한 긴 연구 논문이고, essay는 수업 과제로 쓰는 짧은 글이에요."},{"id":"un_thesis","note":"thesis는 학위 논문이나 글의 핵심 주장을 뜻하고, essay는 하나의 주제를 풀어 쓴 짧은 글 형식이에요."}],"level":1,"track":"univ"},
  {"id":"un_dissertation","term":"dissertation","meaningKo":"학위 논문","pos":"명사","example":"He spent three years writing his doctoral dissertation on ocean currents.","exampleKo":"그는 해류에 관한 박사 학위 논문을 쓰느라 3년을 보냈어요.","confusions":[{"id":"un_thesis","note":"thesis는 석사 논문이나 핵심 주장을 가리키는 말로도 쓰이고, dissertation은 특히 박사 학위 논문에 써요."},{"id":"un_essay","note":"essay는 수업 과제로 쓰는 짧은 글이고, dissertation은 수년간 연구해서 쓰는 방대한 학위 논문이에요."}],"level":1,"track":"univ"},
  {"id":"un_journal","term":"journal","meaningKo":"학술지","pos":"명사","example":"Her research was published in a respected medical journal last spring.","exampleKo":"그녀의 연구는 지난봄 권위 있는 의학 학술지에 실렸어요.","confusions":[{"id":"un_publication","note":"publication은 출판 행위나 출판물 전반이고, journal은 연구 논문을 정기적으로 싣는 학술 간행물이에요."},{"id":"un_manuscript","note":"manuscript는 투고하려는 원고이고, journal은 심사를 거친 논문들이 실리는 정기 간행물이에요."}],"level":1,"track":"univ"},
  {"id":"un_manuscript","term":"manuscript","meaningKo":"원고","pos":"명사","example":"The author submitted the manuscript to the editor before the deadline.","exampleKo":"저자는 마감 전에 편집자에게 원고를 제출했어요.","confusions":[{"id":"un_draft","note":"draft는 쓰는 도중의 초안이고, manuscript는 출판사나 학술지에 제출하는 완성된 원고예요."},{"id":"un_journal","note":"journal은 논문이 실리는 정기 간행물이고, manuscript는 그곳에 보내는 아직 인쇄 전의 원고예요."}],"level":1,"track":"univ"},
  {"id":"un_publication","term":"publication","meaningKo":"출판, 발행물","pos":"명사","example":"Before publication, every article is checked by two independent experts.","exampleKo":"출판 전에 모든 논문은 두 명의 독립된 전문가가 검토해요.","confusions":[{"id":"un_journal","note":"journal은 논문을 싣는 정기 학술지 한 종류이고, publication은 출판 행위와 모든 출판물을 아우르는 말이에요."},{"id":"un_manuscript","note":"manuscript는 출판 전의 원고이고, publication은 그것이 실제로 간행되어 나온 결과나 과정이에요."}],"level":1,"track":"univ"},
  {"id":"un_proofread","term":"proofread","meaningKo":"교정을 보다","pos":"동사","example":"Always proofread your assignment for spelling mistakes before you hand it in.","exampleKo":"과제를 제출하기 전에 항상 철자 오류가 없는지 교정을 보세요.","confusions":[{"id":"un_revise","note":"revise는 내용과 구성을 고쳐 쓰는 것이고, proofread는 철자와 문법 같은 사소한 오류만 최종 점검하는 거예요."},{"id":"un_paraphrase","note":"paraphrase는 남의 말을 내 말로 바꿔 쓰는 것이고, proofread는 오탈자를 찾아 바로잡는 일이에요."}],"level":1,"track":"univ"},
  {"id":"un_revise","term":"revise","meaningKo":"수정하다, 고쳐 쓰다","pos":"동사","example":"You should revise the argument after reading the comments from your classmates.","exampleKo":"반 친구들의 의견을 읽은 뒤 논거를 고쳐 쓰는 게 좋아요.","confusions":[{"id":"un_proofread","note":"proofread는 오탈자만 마지막에 점검하는 것이고, revise는 내용과 구조까지 크게 고치는 것이에요."},{"id":"un_draft","note":"draft는 처음 쓴 초안 자체이고, revise는 그 초안을 읽고 더 낫게 다시 고치는 동작이에요."}],"level":1,"track":"univ"},
  {"id":"un_methodology","term":"methodology","meaningKo":"연구 방법론","pos":"명사","example":"The methodology section describes how the team collected and measured its results.","exampleKo":"방법론 부분은 팀이 결과를 어떻게 모으고 측정했는지 설명해요.","confusions":[{"id":"un_framework","note":"framework는 연구를 떠받치는 개념의 틀이고, methodology는 실제로 연구를 수행하는 절차와 방법이에요."},{"id":"un_theory","note":"theory는 현상을 설명하는 이론이고, methodology는 그 이론을 검증하려고 쓰는 연구 방식이에요."}],"level":1,"track":"univ"},
  {"id":"un_variable","term":"variable","meaningKo":"변수","pos":"명사","example":"Temperature is the only variable we change in this experiment.","exampleKo":"이 실험에서 우리가 바꾸는 변수는 온도 하나뿐이에요.","confusions":[{"id":"un_sample","note":"sample은 연구 대상으로 뽑은 일부 집단이고, variable은 실험에서 바뀌거나 측정되는 요인이에요."},{"id":"un_data","note":"data는 측정해서 얻은 자료이고, variable은 그 자료가 나타내는 변하는 특성 자체예요."}],"level":1,"track":"univ"},
  {"id":"un_correlation","term":"correlation","meaningKo":"상관관계","pos":"명사","example":"There is a strong correlation between hours of sleep and exam scores.","exampleKo":"수면 시간과 시험 점수 사이에는 강한 상관관계가 있어요.","confusions":[{"id":"un_causation","note":"causation은 한쪽이 다른 쪽의 원인이라는 인과관계이고, correlation은 함께 변한다는 관련성일 뿐이에요."},{"id":"un_analysis","note":"analysis는 자료를 살펴 해석하는 과정이고, correlation은 두 변수가 서로 얼마나 함께 움직이는지를 나타내는 관계예요."}],"level":1,"track":"univ"},
  {"id":"un_causation","term":"causation","meaningKo":"인과관계","pos":"명사","example":"Being linked does not prove causation, so we need a controlled experiment.","exampleKo":"관련이 있다고 해서 인과관계가 증명되진 않아서 통제 실험이 필요해요.","confusions":[{"id":"un_correlation","note":"correlation은 함께 변하는 관계이고, causation은 한쪽이 실제로 다른 쪽을 일으키는 원인과 결과의 관계예요."},{"id":"un_hypothesis","note":"hypothesis는 검증할 가설이고, causation은 가설이 입증되었을 때 확인되는 원인과 결과의 관계예요."}],"level":1,"track":"univ"},
  {"id":"un_sample","term":"sample","meaningKo":"표본","pos":"명사","example":"We chose a random sample of two hundred students from the campus.","exampleKo":"우리는 캠퍼스에서 학생 200명을 무작위 표본으로 뽑았어요.","confusions":[{"id":"un_population","note":"population은 연구가 알고 싶은 전체 집단이고, sample은 그중에서 실제로 조사하려고 뽑은 일부예요."},{"id":"un_survey","note":"survey는 의견을 묻는 조사 방법이고, sample은 그 조사에 응하는 사람들로 뽑힌 집단이에요."}],"level":1,"track":"univ"},
  {"id":"un_population","term":"population","meaningKo":"모집단, 인구","pos":"명사","example":"The study wants to describe the whole student population, not just one class.","exampleKo":"이 연구는 한 반이 아니라 전체 학생 모집단을 설명하려 해요.","confusions":[{"id":"un_sample","note":"sample은 모집단에서 뽑은 일부이고, population은 연구 결과를 일반화하고 싶은 전체 대상이에요."},{"id":"un_survey","note":"survey는 조사 행위이고, population은 그 조사가 알고자 하는 대상 전체 집단이에요."}],"level":1,"track":"univ"},
  {"id":"un_survey","term":"survey","meaningKo":"설문 조사","pos":"명사","example":"The university ran a survey to learn how students use the library.","exampleKo":"대학은 학생들이 도서관을 어떻게 쓰는지 알려고 설문 조사를 했어요.","confusions":[{"id":"un_questionnaire","note":"questionnaire는 질문이 적힌 설문지 자체이고, survey는 그것으로 응답을 모아 분석하는 조사 전체예요."},{"id":"un_interview","note":"interview는 사람과 직접 대화하며 묻는 방식이고, survey는 많은 사람에게 같은 질문을 던져 수치로 모으는 방식이에요."}],"level":1,"track":"univ"},
  {"id":"un_questionnaire","term":"questionnaire","meaningKo":"설문지","pos":"명사","example":"Please complete the short questionnaire and return it to the front desk.","exampleKo":"짧은 설문지를 작성해서 안내 데스크에 돌려주세요.","confusions":[{"id":"un_survey","note":"survey는 응답을 모으고 분석하는 조사 전체이고, questionnaire는 그때 쓰는 질문 목록이 담긴 종이나 양식이에요."},{"id":"un_interview","note":"interview는 말로 묻고 답하는 면담이고, questionnaire는 응답자가 직접 읽고 적어 내는 질문지예요."}],"level":1,"track":"univ"},
  {"id":"un_data","term":"data","meaningKo":"자료, 데이터","pos":"명사","example":"We gathered the data over six weeks and stored it in a spreadsheet.","exampleKo":"우리는 6주 동안 자료를 모아 스프레드시트에 저장했어요.","confusions":[{"id":"un_evidence","note":"evidence는 주장을 뒷받침하는 근거이고, data는 아직 해석하지 않은 측정값과 사실의 모음이에요."},{"id":"un_finding","note":"finding은 자료를 분석해서 얻은 결과이고, data는 분석 전의 원자료예요."}],"level":1,"track":"univ"},

  {"id":"un_analysis","term":"analysis","meaningKo":"분석","pos":"명사","example":"Statistical analysis showed that the new teaching method improved results.","exampleKo":"통계 분석은 새 교수법이 성적을 높였다는 것을 보여 줬어요.","confusions":[{"id":"un_synthesis","note":"synthesis는 여러 요소를 합쳐 하나로 만드는 종합이고, analysis는 하나를 잘게 나누어 살피는 분석이에요."},{"id":"un_summary","note":"summary는 내용을 줄여 말하는 것이고, analysis는 내용을 파고들어 의미와 원인을 해석하는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_synthesis","term":"synthesis","meaningKo":"종합, 통합","pos":"명사","example":"Her literature review is a synthesis of twenty different studies.","exampleKo":"그녀의 문헌 검토는 스무 편의 서로 다른 연구를 종합한 거예요.","confusions":[{"id":"un_analysis","note":"analysis는 대상을 나누어 살펴보는 것이고, synthesis는 여러 자료와 생각을 하나로 묶어 새 그림을 만드는 거예요."},{"id":"un_summary","note":"summary는 한 글을 짧게 줄이는 것이고, synthesis는 여러 글의 내용을 엮어 하나의 관점으로 통합하는 거예요."}],"level":1,"track":"univ"},

  {"id":"un_assumption","term":"assumption","meaningKo":"가정, 전제","pos":"명사","example":"Your whole argument rests on the assumption that everyone has internet access.","exampleKo":"네 논거 전체는 모든 사람이 인터넷을 쓸 수 있다는 가정에 기대고 있어요.","confusions":[{"id":"un_hypothesis","note":"hypothesis는 검증하려고 세운 가설이고, assumption은 증명 없이 사실이라고 받아들이고 시작하는 전제예요."},{"id":"un_evidence","note":"evidence는 입증된 근거이고, assumption은 아직 확인하지 않고 옳다고 믿는 바탕이에요."}],"level":1,"track":"univ"},
  {"id":"un_implication","term":"implication","meaningKo":"함의, 시사점","pos":"명사","example":"The study has an important implication for how schools plan their schedules.","exampleKo":"이 연구는 학교가 일정을 짜는 방식에 중요한 시사점을 줘요.","confusions":[{"id":"un_finding","note":"finding은 조사에서 나온 사실 자체이고, implication은 그 사실이 앞으로 무엇을 뜻하는지 보여 주는 의미예요."},{"id":"un_conclusion","note":"conclusion은 논의를 마치며 내리는 판단이고, implication은 결과에서 파생되는 더 넓은 영향이나 암시예요."}],"level":1,"track":"univ"},
  {"id":"un_criterion","term":"criterion","meaningKo":"기준","pos":"명사","example":"Clear writing is the main criterion for grading this assignment.","exampleKo":"명확한 글쓰기가 이 과제를 채점하는 주된 기준이에요.","confusions":[{"id":"un_framework","note":"framework는 생각을 정리하는 큰 틀이고, criterion은 무언가를 판단할 때 대는 구체적인 잣대예요."},{"id":"un_assumption","note":"assumption은 미리 받아들이는 전제이고, criterion은 평가할 때 비교하는 기준이에요."}],"level":1,"track":"univ"},
  {"id":"un_framework","term":"framework","meaningKo":"틀, 체계","pos":"명사","example":"The paper builds a new framework for understanding online learning.","exampleKo":"그 논문은 온라인 학습을 이해하기 위한 새로운 틀을 세워요.","confusions":[{"id":"un_methodology","note":"methodology는 연구를 수행하는 구체적인 방법이고, framework는 연구 전체를 이해하는 개념적 틀이에요."},{"id":"un_theory","note":"theory는 특정 현상을 설명하는 이론이고, framework는 여러 개념을 짜 맞춘 더 넓은 구조예요."}],"level":1,"track":"univ"},
  {"id":"un_concept","term":"concept","meaningKo":"개념","pos":"명사","example":"Opportunity cost is a key concept in your first economics class.","exampleKo":"기회비용은 첫 경제학 수업의 핵심 개념이에요.","confusions":[{"id":"un_theory","note":"theory는 여러 개념을 엮어 현상을 설명하는 이론이고, concept은 그 바탕이 되는 하나의 생각 단위예요."},{"id":"un_phenomenon","note":"phenomenon은 실제로 관찰되는 현상이고, concept은 그것을 이해하려고 머릿속에서 만든 개념이에요."}],"level":1,"track":"univ"},
  {"id":"un_phenomenon","term":"phenomenon","meaningKo":"현상","pos":"명사","example":"Lightning is a natural phenomenon that scientists have studied for centuries.","exampleKo":"번개는 과학자들이 수 세기 동안 연구해 온 자연 현상이에요.","confusions":[{"id":"un_concept","note":"concept은 머릿속에서 만든 개념이고, phenomenon은 실제로 일어나서 관찰할 수 있는 현상이에요."},{"id":"un_finding","note":"finding은 연구로 알아낸 결과이고, phenomenon은 연구의 대상이 되는 관찰 가능한 일이에요."}],"level":1,"track":"univ"},

  {"id":"un_scarcity","term":"scarcity","meaningKo":"희소성, 부족","pos":"명사","example":"Scarcity means people have unlimited wants but only limited time and money.","exampleKo":"희소성이란 사람의 욕구는 무한한데 시간과 돈은 한정되어 있다는 뜻이에요.","confusions":[{"id":"un_surplus","note":"surplus는 쓰고도 남는 잉여이고, scarcity는 원하는 양에 비해 자원이 모자라는 희소성이에요."},{"id":"un_opportunity cost","note":"opportunity cost는 선택하면서 포기한 가장 좋은 대안의 가치이고, scarcity는 그런 선택을 하게 만드는 자원의 한계예요."}],"level":1,"track":"univ"},

  {"id":"un_equilibrium","term":"equilibrium","meaningKo":"균형","pos":"명사","example":"The market reaches equilibrium when buyers and sellers agree on one price.","exampleKo":"구매자와 판매자가 한 가격에 합의하면 시장은 균형에 이르러요.","confusions":[{"id":"un_elasticity","note":"elasticity는 가격이 변할 때 수요가 얼마나 민감하게 변하는지이고, equilibrium은 양쪽 힘이 맞아 안정된 상태예요."},{"id":"un_surplus","note":"surplus는 공급이 수요보다 많아 남는 상태이고, equilibrium은 공급과 수요가 딱 맞는 상태예요."}],"level":1,"track":"univ"},
  {"id":"un_elasticity","term":"elasticity","meaningKo":"탄력성","pos":"명사","example":"The elasticity of demand for luxury bags is high because buyers can wait.","exampleKo":"사치품 가방의 수요 탄력성은 구매자가 기다릴 수 있어서 높아요.","confusions":[{"id":"un_equilibrium","note":"equilibrium은 수요와 공급이 맞는 안정 상태이고, elasticity는 가격 변화에 수요나 공급이 반응하는 정도예요."},{"id":"un_scarcity","note":"scarcity는 자원이 부족한 근본 상태이고, elasticity는 가격에 따라 소비량이 얼마나 변하는지를 재는 개념이에요."}],"level":1,"track":"univ"},
  {"id":"un_monopoly","term":"monopoly","meaningKo":"독점","pos":"명사","example":"A monopoly lets one company set high prices because customers have no choice.","exampleKo":"독점 기업은 고객에게 선택지가 없어서 높은 가격을 정할 수 있어요.","confusions":[{"id":"un_oligopoly","note":"oligopoly는 소수의 몇 기업이 시장을 나눠 갖는 과점이고, monopoly는 단 하나의 기업이 시장을 차지하는 독점이에요."},{"id":"un_competition","note":"competition은 여러 기업이 서로 겨루는 경쟁이고, monopoly는 경쟁자가 없는 독점 상태예요."}],"level":1,"track":"univ"},

  {"id":"un_competition","term":"competition","meaningKo":"경쟁","pos":"명사","example":"Strong competition between shops usually brings lower prices for customers.","exampleKo":"가게들 사이의 치열한 경쟁은 보통 소비자에게 더 낮은 가격을 가져와요.","confusions":[{"id":"un_monopoly","note":"monopoly는 경쟁자가 없는 독점이고, competition은 여러 판매자가 고객을 얻으려고 겨루는 경쟁이에요."},{"id":"un_oligopoly","note":"oligopoly는 소수 기업이 시장을 나눠 갖는 구조이고, competition은 참여자들이 서로 이기려 애쓰는 과정이에요."}],"level":1,"track":"univ"},

  {"id":"un_consumer","term":"consumer","meaningKo":"소비자","pos":"명사","example":"A smart consumer compares prices before buying a new laptop online.","exampleKo":"현명한 소비자는 온라인에서 새 노트북을 사기 전에 가격을 비교해요.","confusions":[{"id":"un_producer","note":"producer는 물건을 만들어 공급하는 생산자이고, consumer는 그 물건을 사서 쓰는 소비자예요."},{"id":"un_citizen","note":"citizen은 한 나라의 시민이라는 신분이고, consumer는 물건이나 서비스를 사는 역할의 사람이에요."}],"level":1,"track":"univ"},
  {"id":"un_producer","term":"producer","meaningKo":"생산자","pos":"명사","example":"The coffee producer sells beans directly to cafes in the city.","exampleKo":"그 커피 생산자는 도시의 카페들에 원두를 직접 팔아요.","confusions":[{"id":"un_consumer","note":"consumer는 물건을 사서 쓰는 소비자이고, producer는 물건을 만들어 시장에 내놓는 생산자예요."},{"id":"un_export","note":"export는 만든 물건을 다른 나라로 파는 수출 행위이고, producer는 그 물건을 만드는 사람이나 기업이에요."}],"level":1,"track":"univ"},
  {"id":"un_import","term":"import","meaningKo":"수입하다","pos":"동사","example":"Our country has to import most of its oil from other nations.","exampleKo":"우리나라는 석유 대부분을 다른 나라에서 수입해야 해요.","confusions":[{"id":"un_export","note":"export는 물건을 다른 나라로 내보내 파는 수출이고, import는 다른 나라에서 물건을 들여오는 수입이에요."},{"id":"un_tariff","note":"tariff는 수입품에 붙이는 관세이고, import는 외국에서 물건을 사 들여오는 행위 자체예요."}],"level":1,"track":"univ"},
  {"id":"un_export","term":"export","meaningKo":"수출하다","pos":"동사","example":"Korea will export more cars to Europe if the new trade deal passes.","exampleKo":"새 무역 협정이 통과되면 한국은 유럽에 자동차를 더 수출할 거예요.","confusions":[{"id":"un_import","note":"import는 외국 물건을 들여오는 수입이고, export는 자국 물건을 외국으로 내보내 파는 수출이에요."},{"id":"un_producer","note":"producer는 상품을 만드는 주체이고, export는 만든 상품을 외국 시장에 파는 행위예요."}],"level":1,"track":"univ"},
  {"id":"un_deficit","term":"deficit","meaningKo":"적자","pos":"명사","example":"The city runs a deficit every year because spending is higher than income.","exampleKo":"그 도시는 지출이 소득보다 많아서 해마다 적자를 내요.","confusions":[{"id":"un_surplus","note":"surplus는 쓰고 남은 흑자이고, deficit은 수입보다 지출이 많아 모자란 적자예요."},{"id":"un_budget","note":"budget은 수입과 지출을 미리 짠 계획이고, deficit은 그 계획에서 지출이 수입을 넘은 부족분이에요."}],"level":1,"track":"univ"},
  {"id":"un_surplus","term":"surplus","meaningKo":"흑자, 잉여","pos":"명사","example":"Farmers had a surplus of rice this year and sold it abroad.","exampleKo":"올해 농민들은 쌀이 남아도는 잉여분을 해외에 팔았어요.","confusions":[{"id":"un_deficit","note":"deficit은 지출이 수입보다 많은 적자이고, surplus는 수입이 지출보다 많아 남는 흑자예요."},{"id":"un_scarcity","note":"scarcity는 필요보다 모자란 부족이고, surplus는 필요보다 남아도는 잉여예요."}],"level":1,"track":"univ"},
  {"id":"un_budget","term":"budget","meaningKo":"예산","pos":"명사","example":"Our student club has a small budget for posters and snacks.","exampleKo":"우리 동아리는 포스터와 간식에 쓸 예산이 적어요.","confusions":[{"id":"un_revenue","note":"revenue는 들어오는 돈 총액이고, budget은 그 돈을 어디에 쓸지 미리 짜 둔 지출 계획이에요."},{"id":"un_deficit","note":"deficit은 지출이 수입을 넘은 적자 상태이고, budget은 수입과 지출을 계획한 표예요."}],"level":1,"track":"univ"},
  {"id":"un_revenue","term":"revenue","meaningKo":"매출, 세입","pos":"명사","example":"The theater earned more revenue after it added weekend movie nights.","exampleKo":"그 극장은 주말 영화의 밤을 추가한 뒤 매출이 늘었어요.","confusions":[{"id":"un_income","note":"income은 개인이 버는 소득을 주로 가리키고, revenue는 기업이나 정부로 들어오는 총수입을 가리켜요."},{"id":"un_budget","note":"budget은 돈을 어떻게 쓸지의 계획이고, revenue는 실제로 들어오는 돈의 총액이에요."}],"level":1,"track":"univ"},
  {"id":"un_income","term":"income","meaningKo":"소득","pos":"명사","example":"Her monthly income is not enough to pay rent in the capital.","exampleKo":"그녀의 월 소득은 수도의 월세를 내기에 충분하지 않아요.","confusions":[{"id":"un_wealth","note":"wealth는 쌓아 둔 재산 전체이고, income은 일정 기간에 들어오는 월급 같은 소득이에요."},{"id":"un_revenue","note":"revenue는 기업이나 정부의 총수입이고, income은 개인이 일해서 받는 소득이에요."}],"level":1,"track":"univ"},
  {"id":"un_wealth","term":"wealth","meaningKo":"부, 재산","pos":"명사","example":"Wealth includes land, savings, and houses, not only a monthly salary.","exampleKo":"부는 월급뿐 아니라 토지, 저축, 집까지 포함해요.","confusions":[{"id":"un_income","note":"income은 일정 기간에 버는 소득이고, wealth는 지금까지 쌓아 둔 자산의 총합이에요."},{"id":"un_poverty","note":"poverty는 생활에 필요한 자원이 부족한 빈곤이고, wealth는 자산이 풍부한 부유한 상태예요."}],"level":1,"track":"univ"},
  {"id":"un_inequality","term":"inequality","meaningKo":"불평등","pos":"명사","example":"Income inequality grows when rich people earn far more than the rest.","exampleKo":"부유한 사람들이 나머지보다 훨씬 많이 벌면 소득 불평등이 커져요.","confusions":[{"id":"un_poverty","note":"poverty는 기본적인 생활이 어려운 빈곤이고, inequality는 사람들 사이의 소득이나 기회가 고르지 않은 불평등이에요."},{"id":"un_welfare","note":"welfare는 어려운 사람을 돕는 복지 제도이고, inequality는 그 제도가 줄이려는 격차 문제예요."}],"level":1,"track":"univ"},
  {"id":"un_poverty","term":"poverty","meaningKo":"빈곤","pos":"명사","example":"Education can help families escape poverty over several generations.","exampleKo":"교육은 여러 세대에 걸쳐 가족이 빈곤에서 벗어나도록 도울 수 있어요.","confusions":[{"id":"un_inequality","note":"inequality는 사람 사이의 격차이고, poverty는 격차와 상관없이 최소한의 생활 수준에 못 미치는 절대적 빈곤이에요."},{"id":"un_unemployment","note":"unemployment는 일자리가 없는 상태이고, poverty는 돈과 자원이 모자라 생활이 어려운 상태예요."}],"level":1,"track":"univ"},
  {"id":"un_globalization","term":"globalization","meaningKo":"세계화","pos":"명사","example":"Globalization lets a student in Seoul buy products made on another continent.","exampleKo":"세계화 덕분에 서울의 학생이 다른 대륙에서 만든 제품을 살 수 있어요.","confusions":[{"id":"un_urbanization","note":"urbanization은 도시로 인구가 모이는 도시화이고, globalization은 국가 사이의 교류가 넓어지는 세계화예요."},{"id":"un_migration","note":"migration은 사람이 지역을 옮겨 가는 이주이고, globalization은 경제와 문화가 세계적으로 연결되는 흐름이에요."}],"level":1,"track":"univ"},
  {"id":"un_urbanization","term":"urbanization","meaningKo":"도시화","pos":"명사","example":"Rapid urbanization has made traffic and housing major problems in the region.","exampleKo":"빠른 도시화로 그 지역에서는 교통과 주택이 큰 문제가 됐어요.","confusions":[{"id":"un_globalization","note":"globalization은 세계가 하나로 연결되는 흐름이고, urbanization은 농촌 인구가 도시로 몰려 도시가 커지는 과정이에요."},{"id":"un_migration","note":"migration은 사람이 이동하는 행위이고, urbanization은 그 결과 도시 지역이 늘어나는 변화예요."}],"level":1,"track":"univ"},
  {"id":"un_society","term":"society","meaningKo":"사회","pos":"명사","example":"A healthy society protects its weakest members and values fair rules.","exampleKo":"건강한 사회는 가장 약한 구성원을 보호하고 공정한 규칙을 중시해요.","confusions":[{"id":"un_culture","note":"culture는 한 집단의 관습과 예술 같은 문화이고, society는 그 문화를 공유하며 사는 사람들의 조직화된 집단이에요."},{"id":"un_institution","note":"institution은 학교나 법원 같은 사회의 제도와 기관이고, society는 그것을 포함한 사람들의 공동체 전체예요."}],"level":1,"track":"univ"},
  {"id":"un_culture","term":"culture","meaningKo":"문화","pos":"명사","example":"Food, music, and holidays are all part of the culture of a nation.","exampleKo":"음식, 음악, 명절은 모두 한 나라 문화의 일부예요.","confusions":[{"id":"un_society","note":"society는 사람들이 모여 사는 집단이고, culture는 그 집단이 공유하는 생활 방식과 가치관이에요."},{"id":"un_norm","note":"norm은 집단에서 기대되는 행동 규범이고, culture는 그런 규범까지 포함한 생활 방식 전체예요."}],"level":1,"track":"univ"},
  {"id":"un_institution","term":"institution","meaningKo":"제도, 기관","pos":"명사","example":"The court is an institution that helps settle arguments between people.","exampleKo":"법원은 사람들 사이의 다툼을 해결해 주는 제도적 기관이에요.","confusions":[{"id":"un_society","note":"society는 사람들의 공동체 전체이고, institution은 그 안에서 규칙을 만들고 유지하는 학교나 법원 같은 제도예요."},{"id":"un_bureaucracy","note":"bureaucracy는 규정에 따라 일하는 관료 조직이고, institution은 사회에 자리 잡은 제도나 기관 전반이에요."}],"level":1,"track":"univ"},
  {"id":"un_norm","term":"norm","meaningKo":"규범","pos":"명사","example":"Waiting in line is a social norm in almost every country of the world.","exampleKo":"줄을 서서 기다리는 것은 세계 거의 모든 나라의 사회 규범이에요.","confusions":[{"id":"un_stereotype","note":"stereotype은 집단에 대한 단순한 고정관념이고, norm은 집단에서 마땅하다고 여기는 행동 기준이에요."},{"id":"un_culture","note":"culture는 생활 방식 전체이고, norm은 그 안에서 무엇이 옳은 행동인지 정해 주는 구체적인 규범이에요."}],"level":1,"track":"univ"},
  {"id":"un_stereotype","term":"stereotype","meaningKo":"고정관념","pos":"명사","example":"It is a stereotype that all engineers are quiet and dislike speaking in public.","exampleKo":"모든 공학도가 조용하고 발표를 싫어한다는 것은 고정관념이에요.","confusions":[{"id":"un_norm","note":"norm은 집단이 따르기로 한 행동 규범이고, stereotype은 특정 집단을 단순하게 일반화한 잘못된 인식이에요."},{"id":"un_bias","note":"bias는 한쪽으로 치우친 편견 전반이고, stereotype은 집단에 대한 틀에 박힌 고정된 이미지예요."}],"level":1,"track":"univ"},
  {"id":"un_ideology","term":"ideology","meaningKo":"이념","pos":"명사","example":"Each political party is built on a different ideology about the role of government.","exampleKo":"각 정당은 정부의 역할에 대한 서로 다른 이념 위에 세워져 있어요.","confusions":[{"id":"un_democracy","note":"democracy는 국민이 다스리는 정치 제도이고, ideology는 정치와 사회에 대한 신념 체계인 이념이에요."},{"id":"un_capitalism","note":"capitalism은 자본을 사적으로 소유하는 경제 체제이고, ideology는 그런 체제를 뒷받침하는 신념과 사상 체계예요."}],"level":1,"track":"univ"},
  {"id":"un_democracy","term":"democracy","meaningKo":"민주주의","pos":"명사","example":"In a democracy, citizens choose their leaders through free and fair votes.","exampleKo":"민주주의에서는 시민이 자유롭고 공정한 투표로 지도자를 뽑아요.","confusions":[{"id":"un_ideology","note":"ideology는 특정 신념 체계인 이념이고, democracy는 국민이 주권을 갖고 정치에 참여하는 제도예요."},{"id":"un_sovereignty","note":"sovereignty는 나라가 스스로 다스리는 주권이고, democracy는 그 주권이 국민에게 있다는 정치 체제예요."}],"level":1,"track":"univ"},
  {"id":"un_bureaucracy","term":"bureaucracy","meaningKo":"관료제","pos":"명사","example":"Getting a permit took weeks because of the slow bureaucracy in the office.","exampleKo":"그 사무소의 느린 관료제 때문에 허가를 받는 데 몇 주가 걸렸어요.","confusions":[{"id":"un_institution","note":"institution은 사회를 유지하는 제도와 기관이고, bureaucracy는 엄격한 규정과 절차로 움직이는 관료 조직과 그 방식이에요."},{"id":"un_legislation","note":"legislation은 법을 만드는 입법이고, bureaucracy는 만들어진 법과 규정을 행정 절차로 집행하는 조직이에요."}],"level":1,"track":"univ"},
  {"id":"un_sovereignty","term":"sovereignty","meaningKo":"주권","pos":"명사","example":"The island nation fought hard to protect its sovereignty from foreign control.","exampleKo":"그 섬나라는 외국의 지배로부터 주권을 지키려고 치열하게 싸웠어요.","confusions":[{"id":"un_democracy","note":"democracy는 국민이 다스리는 정치 제도이고, sovereignty는 나라가 외부의 간섭 없이 스스로 결정하는 최고 권력이에요."},{"id":"un_legislation","note":"legislation은 법을 만드는 일이고, sovereignty는 법을 만들고 집행할 수 있는 국가의 최고 권한이에요."}],"level":1,"track":"univ"},
  {"id":"un_legislation","term":"legislation","meaningKo":"입법, 법률","pos":"명사","example":"New legislation on student loans will take effect in the spring.","exampleKo":"학자금 대출에 관한 새 법률이 봄에 시행돼요.","confusions":[{"id":"un_sovereignty","note":"sovereignty는 국가의 최고 권한인 주권이고, legislation은 그 권한으로 의회가 만드는 법이나 입법 활동이에요."},{"id":"un_bureaucracy","note":"bureaucracy는 법을 집행하는 행정 조직이고, legislation은 의회가 법을 만들어 내는 입법이에요."}],"level":1,"track":"univ"},
  {"id":"un_citizen","term":"citizen","meaningKo":"시민, 국민","pos":"명사","example":"Every citizen over eighteen has the right to vote in national elections.","exampleKo":"18세가 넘은 모든 국민은 국가 선거에서 투표할 권리가 있어요.","confusions":[{"id":"un_consumer","note":"consumer는 상품을 사는 소비자이고, citizen은 한 나라나 도시에 속해 권리와 의무를 갖는 시민이에요."},{"id":"un_minority","note":"minority는 전체 중 수가 적은 소수 집단이고, citizen은 그 수와 상관없이 같은 권리를 가진 국민이에요."}],"level":1,"track":"univ"},
  {"id":"un_minority","term":"minority","meaningKo":"소수 집단","pos":"명사","example":"The law protects the language rights of every ethnic minority in the country.","exampleKo":"그 법은 나라의 모든 소수 민족의 언어 권리를 보호해요.","confusions":[{"id":"un_majority","note":"majority는 절반을 넘는 다수이고, minority는 전체에서 수가 더 적은 소수 집단이에요."},{"id":"un_citizen","note":"citizen은 국가의 구성원인 시민이고, minority는 그 구성원 중 수가 적은 특정 집단이에요."}],"level":1,"track":"univ"},
  {"id":"un_majority","term":"majority","meaningKo":"다수","pos":"명사","example":"The majority of voters supported the plan to build a new subway line.","exampleKo":"유권자의 다수가 새 지하철 노선을 짓는 계획을 지지했어요.","confusions":[{"id":"un_minority","note":"minority는 수가 적은 소수이고, majority는 절반을 넘는 더 많은 쪽이에요."},{"id":"un_democracy","note":"democracy는 국민이 다스리는 제도이고, majority는 그 제도에서 결정을 좌우하는 다수의 사람들이에요."}],"level":1,"track":"univ"},
  {"id":"un_migration","term":"migration","meaningKo":"이주","pos":"명사","example":"Seasonal migration of workers from villages to cities has increased since 2000.","exampleKo":"마을에서 도시로 가는 노동자들의 계절적 이주가 2000년 이후 늘었어요.","confusions":[{"id":"un_urbanization","note":"urbanization은 도시가 커지고 도시 인구가 늘어나는 변화이고, migration은 사람이 한 곳에서 다른 곳으로 옮겨 가는 이동이에요."},{"id":"un_globalization","note":"globalization은 세계가 경제적으로 연결되는 흐름이고, migration은 사람이 나라나 지역을 옮겨 사는 이동이에요."}],"level":1,"track":"univ"},
  {"id":"un_capitalism","term":"capitalism","meaningKo":"자본주의","pos":"명사","example":"Capitalism relies on private ownership and the freedom to start a business.","exampleKo":"자본주의는 사유 재산과 사업을 시작할 자유에 바탕을 둬요.","confusions":[{"id":"un_socialism","note":"socialism은 생산 수단을 공동으로 소유하려는 사회주의이고, capitalism은 개인이 자본을 소유하고 이윤을 추구하는 체제예요."},{"id":"un_ideology","note":"ideology는 정치와 사회에 대한 신념 체계이고, capitalism은 사유 재산과 시장에 기반한 구체적인 경제 체제예요."}],"level":1,"track":"univ"},
  {"id":"un_socialism","term":"socialism","meaningKo":"사회주의","pos":"명사","example":"Socialism argues that major industries should be owned by the whole community.","exampleKo":"사회주의는 주요 산업을 공동체 전체가 소유해야 한다고 주장해요.","confusions":[{"id":"un_capitalism","note":"capitalism은 개인의 자본 소유와 시장 경쟁을 중시하고, socialism은 공동 소유와 평등한 분배를 중시해요."},{"id":"un_welfare","note":"welfare는 어려운 사람을 돕는 복지 제도이고, socialism은 경제 전체를 공동체 중심으로 운영하려는 체제예요."}],"level":1,"track":"univ"},
  {"id":"un_welfare","term":"welfare","meaningKo":"복지","pos":"명사","example":"The welfare system gives food and housing help to families in need.","exampleKo":"복지 제도는 어려운 가정에 식량과 주거 지원을 해 줘요.","confusions":[{"id":"un_poverty","note":"poverty는 생활이 어려운 빈곤 상태이고, welfare는 그런 사람들을 돕는 사회적 지원 제도예요."},{"id":"un_socialism","note":"socialism은 공동 소유를 중시하는 체제이고, welfare는 자본주의 국가에도 있는 사회 보장과 지원 제도예요."}],"level":1,"track":"univ"},
  {"id":"un_productivity","term":"productivity","meaningKo":"생산성","pos":"명사","example":"New software raised the productivity of our whole team in just two months.","exampleKo":"새 소프트웨어는 불과 두 달 만에 팀 전체의 생산성을 높였어요.","confusions":[{"id":"un_income","note":"income은 번 돈이고, productivity는 같은 시간과 자원으로 얼마나 많이 만들어 내는지를 나타내요."},{"id":"un_export","note":"export는 만든 물건을 외국에 파는 것이고, productivity는 물건을 만들어 내는 효율이에요."}],"level":1,"track":"univ"},
  {"id":"un_molecule","term":"molecule","meaningKo":"분자","pos":"명사","example":"A water molecule is made of two hydrogen parts and one oxygen part.","exampleKo":"물 분자는 수소 두 개와 산소 한 개로 이루어져 있어요.","confusions":[{"id":"un_atom","note":"atom은 물질을 이루는 가장 작은 입자이고, molecule은 두 개 이상의 원자가 결합해 만든 입자예요."},{"id":"un_compound","note":"compound는 서로 다른 원소로 된 화합물이고, molecule은 원자들이 결합한 입자 하나를 가리켜요."}],"level":1,"track":"univ"},
  {"id":"un_atom","term":"atom","meaningKo":"원자","pos":"명사","example":"Each atom has a tiny center surrounded by fast-moving electrons.","exampleKo":"각 원자는 빠르게 움직이는 전자들에 둘러싸인 작은 중심을 가져요.","confusions":[{"id":"un_molecule","note":"molecule은 원자들이 결합한 분자이고, atom은 그 분자를 이루는 더 작은 기본 입자예요."},{"id":"un_element","note":"element는 같은 종류의 원자로만 이루어진 원소라는 종류이고, atom은 그 원소의 입자 하나예요."}],"level":1,"track":"univ"},

  {"id":"un_consult","term":"consult","meaningKo":"상담하다, 참고하다","pos":"동사","example":"You should consult a doctor before you start a strict diet.","exampleKo":"엄격한 식단을 시작하기 전에 의사와 상담해야 해요.","confusions":[{"id":"un_interview","note":"interview는 질문해서 정보를 얻거나 사람을 평가하는 것이고, consult는 전문가에게 조언을 구하는 것이에요."},{"id":"un_clarify","note":"clarify는 흐릿한 내용을 분명히 하는 것이고, consult는 전문가나 자료의 도움을 구하는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_clarify","term":"clarify","meaningKo":"명확히 하다","pos":"동사","example":"Could you clarify what you mean by the word fair in your essay?","exampleKo":"에세이에서 공정이라는 말이 무슨 뜻인지 명확히 해 주실래요?","confusions":[{"id":"un_elaborate","note":"elaborate는 이미 말한 것을 더 길고 자세히 설명하는 것이고, clarify는 애매한 부분을 분명하게 만드는 것이에요."},{"id":"un_emphasize","note":"emphasize는 중요한 부분을 두드러지게 하는 것이고, clarify는 이해하기 어려운 부분을 쉽게 밝히는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_elaborate","term":"elaborate","meaningKo":"상세히 설명하다","pos":"동사","example":"Please elaborate on your second point so that everyone can follow it.","exampleKo":"모두가 따라올 수 있도록 두 번째 요점을 상세히 설명해 주세요.","confusions":[{"id":"un_clarify","note":"clarify는 모호한 부분을 분명히 하는 것이고, elaborate는 이미 말한 내용에 설명을 더해 더 자세히 풀어내는 것이에요."},{"id":"un_summarize","note":"summarize는 내용을 짧게 줄이는 것이고, elaborate는 반대로 더 길고 자세하게 늘려 설명하는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_summarize","term":"summarize","meaningKo":"요약하다","pos":"동사","example":"Please summarize the article in three sentences for the class.","exampleKo":"반 친구들을 위해 그 기사를 세 문장으로 요약해 주세요.","confusions":[{"id":"un_conclude","note":"conclude는 증거에서 최종 판단을 내리는 것이고, summarize는 내용의 핵심만 간추려 다시 말하는 것이에요."},{"id":"un_elaborate","note":"elaborate는 내용을 더 자세히 풀어 말하는 것이고, summarize는 핵심만 남기고 짧게 줄이는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_constitute","term":"constitute","meaningKo":"구성하다","pos":"동사","example":"Women constitute more than half of the students in this department.","exampleKo":"이 학과에서는 여학생이 학생의 절반 이상을 구성해요.","confusions":[{"id":"un_contribute","note":"contribute는 일에 기여하거나 보태는 것이고, constitute는 전체를 이루는 부분이나 구성원이 되는 것이에요."},{"id":"un_establish","note":"establish는 무언가를 새로 세우는 것이고, constitute는 이미 있는 전체를 이루는 구성분이 되는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_comply","term":"comply","meaningKo":"따르다, 준수하다","pos":"동사","example":"All students must comply with the safety rules in the chemistry room.","exampleKo":"모든 학생은 화학실의 안전 규칙을 준수해야 해요.","confusions":[{"id":"un_implement","note":"implement는 규칙이나 계획을 실제로 실행에 옮기는 쪽이고, comply는 이미 정해진 규칙을 지키는 쪽이에요."},{"id":"un_submit","note":"submit은 서류를 내는 것이고, comply는 규칙이나 요구에 맞게 행동하는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_enhance","term":"enhance","meaningKo":"향상시키다","pos":"동사","example":"Good lighting can enhance the quality of the photos you take.","exampleKo":"좋은 조명은 찍은 사진의 품질을 향상시킬 수 있어요.","confusions":[{"id":"un_contribute","note":"contribute는 어떤 일에 보태는 것이고, enhance는 이미 있는 것의 가치나 질을 더 높이는 것이에요."},{"id":"un_acquire","note":"acquire는 새로 갖추는 것이고, enhance는 이미 가진 것을 더 좋게 끌어올리는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_contrast","term":"contrast","meaningKo":"대조하다","pos":"동사","example":"The article will contrast life in the city with life in the village.","exampleKo":"그 기사는 도시 생활과 시골 생활을 대조해요.","confusions":[{"id":"un_compare","note":"compare는 비슷한 점과 다른 점을 모두 살피는 것이고, contrast는 둘의 차이점에 초점을 맞춰 보여 주는 것이에요."},{"id":"un_distinguish","note":"distinguish는 서로 다른 것을 가려내는 것이고, contrast는 차이를 드러내려고 둘을 맞세우는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_compare","term":"compare","meaningKo":"비교하다","pos":"동사","example":"Before you buy, compare the prices of the same laptop in three shops.","exampleKo":"사기 전에 같은 노트북의 가격을 세 가게에서 비교해 보세요.","confusions":[{"id":"un_contrast","note":"contrast는 차이점에 초점을 둔 대조이고, compare는 닮은 점과 다른 점을 함께 살펴보는 비교예요."},{"id":"un_distinguish","note":"distinguish는 다른 것을 알아채 구별하는 것이고, compare는 둘을 나란히 놓고 견주어 보는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_significant","term":"significant","meaningKo":"중요한, 유의미한","pos":"형용사","example":"There was a significant rise in the number of online courses last year.","exampleKo":"작년에 온라인 강좌 수가 눈에 띄게 크게 늘었어요.","confusions":[{"id":"un_substantial","note":"substantial은 양이나 규모가 상당히 큰 것이고, significant는 의미나 영향이 중요해 주목할 만한 것이에요."},{"id":"un_crucial","note":"crucial은 성패를 좌우할 만큼 결정적인 것이고, significant는 눈여겨볼 만큼 의미가 큰 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_relevant","term":"relevant","meaningKo":"관련 있는","pos":"형용사","example":"Please include only relevant facts that support your main argument.","exampleKo":"주요 논증을 뒷받침하는 관련 있는 사실만 넣어 주세요.","confusions":[{"id":"un_valid","note":"valid는 논리나 근거가 타당한 것이고, relevant는 주제와 직접 관련이 있어 쓸모가 있는 것이에요."},{"id":"un_significant","note":"significant는 중요하고 의미가 큰 것이고, relevant는 다루는 주제와 연결되어 있는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_consistent","term":"consistent","meaningKo":"일관된","pos":"형용사","example":"Her grades have been consistent, always between eighty and ninety points.","exampleKo":"그녀의 성적은 늘 80점에서 90점 사이로 일관되어 왔어요.","confusions":[{"id":"un_reliable","note":"reliable은 믿고 맡길 수 있는 것이고, consistent는 시간이 지나도 변하지 않고 한결같은 것이에요."},{"id":"un_valid","note":"valid는 논리적으로 타당한 것이고, consistent는 앞뒤가 모순 없이 한결같은 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_adequate","term":"adequate","meaningKo":"충분한, 적절한","pos":"형용사","example":"The room has adequate space for thirty students and their desks.","exampleKo":"그 방은 학생 서른 명과 책상을 놓기에 충분한 공간이 있어요.","confusions":[{"id":"un_substantial","note":"substantial은 양이 상당히 많은 것이고, adequate는 필요를 겨우 채우는 정도의 충분함이에요."},{"id":"un_comprehensive","note":"comprehensive는 모든 면을 폭넓게 포함하는 것이고, adequate는 필요한 만큼 충분하다는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_ambiguous","term":"ambiguous","meaningKo":"모호한","pos":"형용사","example":"The question was ambiguous, so students gave very different answers.","exampleKo":"질문이 모호해서 학생들이 아주 다른 답을 냈어요.","confusions":[{"id":"un_precise","note":"precise는 세부까지 정확하고 분명한 것이고, ambiguous는 뜻이 둘 이상으로 읽혀 분명하지 않은 것이에요."},{"id":"un_plausible","note":"plausible은 그럴듯해서 믿을 만한 것이고, ambiguous는 의미가 불분명해 여러 해석이 가능한 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_comprehensive","term":"comprehensive","meaningKo":"포괄적인","pos":"형용사","example":"The guide gives a comprehensive overview of every course in the program.","exampleKo":"그 안내서는 과정의 모든 과목에 대한 포괄적인 개요를 줘요.","confusions":[{"id":"un_superficial","note":"superficial은 겉만 훑는 피상적인 것이고, comprehensive는 모든 부분을 빠짐없이 폭넓게 다루는 것이에요."},{"id":"un_fundamental","note":"fundamental은 바탕이 되는 근본적인 것이고, comprehensive는 범위가 넓게 두루 포함하는 것이에요."}],"level":1,"track":"univ"},

  {"id":"un_substantial","term":"substantial","meaningKo":"상당한","pos":"형용사","example":"She received a substantial amount of money for her research project.","exampleKo":"그녀는 연구 프로젝트로 상당한 금액을 받았어요.","confusions":[{"id":"un_significant","note":"significant는 의미나 영향이 중요한 것이고, substantial은 양이나 크기가 상당히 큰 것이에요."},{"id":"un_adequate","note":"adequate는 필요를 채우는 정도이고, substantial은 필요 이상으로 꽤 많고 큰 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_potential","term":"potential","meaningKo":"잠재적인","pos":"형용사","example":"The potential risks of the new drug must be tested carefully.","exampleKo":"그 신약의 잠재적인 위험은 신중히 검사해야 해요.","confusions":[{"id":"un_plausible","note":"plausible은 그럴듯해서 믿을 만한 것이고, potential은 아직 나타나지 않았지만 앞으로 생길 수 있는 것이에요."},{"id":"un_inevitable","note":"inevitable은 반드시 일어날 불가피한 것이고, potential은 일어날 가능성이 있을 뿐인 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_valid","term":"valid","meaningKo":"타당한, 유효한","pos":"형용사","example":"The student gave a valid reason for being late to the exam.","exampleKo":"학생은 시험에 늦은 타당한 이유를 댔어요.","confusions":[{"id":"un_reliable","note":"reliable은 믿고 쓸 수 있는 것이고, valid는 논리나 규정에 비추어 타당하거나 유효한 것이에요."},{"id":"un_relevant","note":"relevant는 주제와 관련이 있는 것이고, valid는 근거가 탄탄해 인정받을 수 있는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_controversial","term":"controversial","meaningKo":"논란이 많은","pos":"형용사","example":"The new grading system is controversial among parents and teachers.","exampleKo":"새 평가 제도는 학부모와 교사들 사이에서 논란이 많아요.","confusions":[{"id":"un_ambiguous","note":"ambiguous는 뜻이 분명하지 않은 모호한 것이고, controversial은 사람들의 의견이 크게 갈려 논쟁이 되는 것이에요."},{"id":"un_plausible","note":"plausible은 그럴듯한 것이고, controversial은 찬반이 크게 나뉘어 다툼이 일어나는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_inevitable","term":"inevitable","meaningKo":"불가피한","pos":"형용사","example":"Some delay was inevitable because of the heavy snow on the roads.","exampleKo":"도로에 눈이 많이 와서 어느 정도 지연은 불가피했어요.","confusions":[{"id":"un_potential","note":"potential은 생길 수도 있는 가능성이고, inevitable은 피할 수 없이 반드시 일어나는 것이에요."},{"id":"un_crucial","note":"crucial은 결과를 좌우하는 결정적인 것이고, inevitable은 막을 수 없이 닥치는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_accurate","term":"accurate","meaningKo":"정확한","pos":"형용사","example":"The map is accurate, so you can trust it to find the building.","exampleKo":"그 지도는 정확해서 믿고 건물을 찾아도 돼요.","confusions":[{"id":"un_precise","note":"precise는 소수점처럼 세밀한 정도까지 정밀한 것이고, accurate는 실제 사실과 잘 맞는 정확한 것이에요."},{"id":"un_reliable","note":"reliable은 늘 믿고 쓸 수 있는 것이고, accurate는 사실이나 값이 틀리지 않고 맞는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_precise","term":"precise","meaningKo":"정밀한","pos":"형용사","example":"Scientists need precise tools that can measure up to one thousandth of a gram.","exampleKo":"과학자들은 1000분의 1그램까지 재는 정밀한 도구가 필요해요.","confusions":[{"id":"un_accurate","note":"accurate는 실제 값과 얼마나 가까운지 맞는 정도이고, precise는 측정이 세밀하고 반복해도 오차가 작은 정도예요."},{"id":"un_ambiguous","note":"ambiguous는 뜻이 불분명해 여러 해석이 가능한 것이고, precise는 세부까지 분명하고 오해의 여지가 없는 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_crucial","term":"crucial","meaningKo":"결정적인","pos":"형용사","example":"Getting enough sleep is crucial for doing well on the exam tomorrow.","exampleKo":"충분히 자는 것은 내일 시험을 잘 보는 데 결정적이에요.","confusions":[{"id":"un_significant","note":"significant는 의미가 커서 주목할 만한 것이고, crucial은 성패가 거기에 달린 결정적인 것이에요."},{"id":"un_fundamental","note":"fundamental은 모든 것의 바탕이 되는 근본적인 것이고, crucial은 결과를 가르는 결정적인 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_superficial","term":"superficial","meaningKo":"피상적인","pos":"형용사","example":"His knowledge of the topic is superficial because he only read the headlines.","exampleKo":"그는 제목만 읽어서 그 주제에 대한 지식이 피상적이에요.","confusions":[{"id":"un_comprehensive","note":"comprehensive는 모든 면을 깊고 넓게 다루는 포괄적인 것이고, superficial은 겉만 훑어 깊이가 없는 것이에요."},{"id":"un_fundamental","note":"fundamental은 바탕까지 파고든 근본적인 것이고, superficial은 표면에만 머무는 피상적인 것이에요."}],"level":1,"track":"univ"},
  {"id":"un_plausible","term":"plausible","meaningKo":"그럴듯한","pos":"형용사","example":"Her explanation sounds plausible, but we still need data to prove it.","exampleKo":"그녀의 설명은 그럴듯하게 들리지만 증명하려면 여전히 자료가 필요해요.","confusions":[{"id":"un_valid","note":"valid는 근거가 탄탄해 인정되는 타당한 것이고, plausible은 사실일 듯해서 믿을 만하게 들리는 것이에요."},{"id":"un_potential","note":"potential은 앞으로 일어날 수 있는 가능성이고, plausible은 지금 들어서 그럴듯해 보이는 것이에요."}],"level":1,"track":"univ"},

const MIN=60000, DAY=86400000;
const GAP = {1:0, 2:10*MIN, 3:DAY, 4:3*DAY, 5:7*DAY};

/* ---------- 음성 (Web Speech API) ----------
   조용히 실패하지 않는 것이 이 모듈의 제1 규칙이다.
   안 들리면 왜 안 들리는지 반드시 화면에 띄운다.                     */
const TTS = {
  voices: [], started: false,

  available(){
    return typeof window !== 'undefined'
        && 'speechSynthesis' in window
        && typeof SpeechSynthesisUtterance !== 'undefined';
  },

  refresh(){
    if(!this.available()) return;
    try{ this.voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); }catch(e){}
  },

  pick(){
    if(!this.voices.length) this.refresh();
    return this.voices.find(v => v.lang === 'en-US')
        || this.voices.find(v => /^en[-_]GB/i.test(v.lang))
        || this.voices[0] || null;
  },

  say(text, btn){
    if(!text) return;
    if(btn){ btn.classList.add('busy'); setTimeout(()=>btn.classList.remove('busy'), 700); }

    if(!this.available()){
      toast('이 화면에서는 음성이 차단됩니다. 파일을 내려받아 Chrome이나 삼성 인터넷에서 열어 주세요.', 4200);
      return;
    }

    try{
      const ss = speechSynthesis;
      if(ss.speaking || ss.pending) ss.cancel();

      // 안드로이드 Chrome: cancel() 직후 speak()를 부르면 조용히 무시된다. 한 틱 쉬어 준다.
      setTimeout(() => {
        try{
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';                 // 한국어 엔진이 영어를 읽지 않도록 명시
          u.rate = 0.92;
          const v = this.pick(); if(v) u.voice = v;

          let fired = false;
          u.onstart = () => { fired = true; TTS.started = true; };
          u.onerror = e => {
            if(e && (e.error === 'canceled' || e.error === 'interrupted')) return;
            toast('음성 재생 실패' + (e && e.error ? ' (' + e.error + ')' : ''), 3200);
          };

          ss.speak(u);
          ss.resume();                      // 일부 안드로이드에서 큐가 멈춘 채로 시작된다

          // 1.5초 안에 시작도 실패도 없으면 엔진이 죽은 것으로 간주하고 알린다
          setTimeout(() => {
            if(!fired && !ss.speaking && !ss.pending && !TTS.started){
              toast('음성 엔진이 응답하지 않습니다. 설정 > 접근성 > 텍스트 음성 변환에서 영어 음성이 설치돼 있는지 확인해 주세요.', 5000);
            }
          }, 1500);
        }catch(e){ toast('음성 오류: ' + e.message, 3200); }
      }, 60);
    }catch(e){ toast('음성 오류: ' + e.message, 3200); }
  },

  diagnose(){
    if(!this.available()){
      toast('speechSynthesis 없음 — 이 화면(미리보기 프레임)에서는 음성을 쓸 수 없습니다. 파일을 내려받아 브라우저에서 여세요.', 5500);
      return;
    }
    this.refresh();
    const all = (()=>{ try{ return speechSynthesis.getVoices().length; }catch(e){ return 0; } })();
    toast('음성 엔진 있음 · 전체 ' + all + '개 / 영어 ' + this.voices.length + '개 · 지금 재생해 봅니다', 4000);
    this.say('Business English. Leverage. Stakeholder.');
  }
};
if(TTS.available()){
  TTS.refresh();
  try{ speechSynthesis.onvoiceschanged = () => TTS.refresh(); }catch(e){}
  setTimeout(()=>TTS.refresh(), 500);   // 안드로이드는 목록이 늦게 온다
  setTimeout(()=>TTS.refresh(), 1500);
}

let toastTimer = null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  if(!t){ return; }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms || 2600);
}

/* ---------- 퀴즈 엔진 ---------- */
const SIZE = 10, BLANK = '______';
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

let PICK = { track: 'work', level: 0, cat: 'mix' };   // level 0 = 전체, cat: word | grammar | mix
const LEVEL_KO = {1:'기초 업무', 2:'회의·프로젝트', 3:'재무·법무'};   // 직장인 트랙에만 있는 세부 분야
const TRACKS = [
  {id:'toddler', name:'유아',     emoji:'🧸', sub:'그림 보고 첫 영어 단어 익히기'},
  {id:'child',   name:'어린이',   emoji:'🎈', sub:'일상 단어와 쉬운 문장'},
  {id:'elem',    name:'초등학생', emoji:'🎒', sub:'학교생활 단어와 기초 문법'},
  {id:'mid',     name:'중학생',   emoji:'📘', sub:'교과서 필수 어휘와 내신 문법'},
  {id:'high',    name:'고등학생', emoji:'📝', sub:'수능·내신 어휘와 어법'},
  {id:'univ',    name:'대학생',   emoji:'🎓', sub:'학업·취업 준비 영어'},
  {id:'work',    name:'직장인',   emoji:'💼', sub:'회의와 메일에서 바로 쓰는 비즈니스 영어'}
];
const TRACK = id => TRACKS.find(t => t.id === id) || TRACKS[TRACKS.length-1];
WORDS.forEach(w => { w.track = w.track || 'work'; });
GRAMMAR.forEach(g => { g.track = g.track || 'work'; });
const ipaOf = (w, style) => w.ipa ? `<span class="ipa"${style ? ` style="${style}"` : ''}>${esc(w.ipa)}</span>` : '';
const emojiOf = w => w.emoji ? `<div style="font-size:60px;line-height:1.2;margin-bottom:6px">${w.emoji}</div>` : '';

const inLevel = x => x.track === PICK.track && (PICK.level === 0 || x.level === PICK.level);
const key = it => it.kind === 'g' ? 'g:' + it.id : it.id;

function pickPool(list, kind, n){
  const now = Date.now(), it = P.items;
  const k = x => kind === 'g' ? 'g:' + x.id : x.id;
  const src = list.filter(inLevel);
  const due    = src.filter(x => it[k(x)] && it[k(x)].due <= now).sort((a,b)=>it[k(a)].box-it[k(b)].box);
  const unseen = src.filter(x => !it[k(x)]);
  const rest   = src.filter(x => it[k(x)] && it[k(x)].due > now).sort((a,b)=>it[k(a)].box-it[k(b)].box);
  const seen = new Set(), out = [];
  for(const x of [...due, ...unseen, ...rest]){
    if(seen.has(x.id)) continue;
    seen.add(x.id); out.push(x);
    if(out.length === n) break;
  }
  return out;
}

const modeFor = box => box <= 2 ? 'MEANING' : (box === 3 ? 'RECALL' : 'CLOZE');
const MODE_KO = {MEANING:'뜻 고르기', RECALL:'영어로 떠올리기', CLOZE:'문장 빈칸', GRAMMAR:'문법 빈칸'};
const blankOut = w => w.example.replace(new RegExp('\\b'+w.term+'\\b','ig'), BLANK);

function build(target, mode, retry){
  // 1순위: 사람이 지정한 '헷갈리는 짝'. 무작위로 뽑으면 소거법으로 다 풀린다.
  const curated = shuffle(target.confusions.map(c=>BY[c.id]).filter(Boolean)).slice(0,3);
  const used = new Set([...curated.map(w=>w.id), target.id]);
  const pool = WORDS.filter(w => !used.has(w.id) && w.track === target.track);
  const fill = [...shuffle(pool.filter(w=>w.pos===target.pos)), ...shuffle(pool.filter(w=>w.pos!==target.pos))]
                 .slice(0, Math.max(0, 3 - curated.length));
  const opts = shuffle([...curated, ...fill, target])
                 .map(w => ({id:w.id, label: mode==='MEANING' ? w.meaningKo : w.term}));
  const prompt = mode==='MEANING' ? target.term : mode==='RECALL' ? target.meaningKo : blankOut(target);
  return {kind:'w', w:target, mode, prompt, opts, retry:!!retry, id:target.id};
}

function buildG(g, retry){
  // 문법 오답은 한국어 화자가 실제로 저지르는 실수다. 무작위였다면 문법 문제는 의미가 없다.
  const opts = shuffle(g.options).map(o => ({id:o, label:o}));
  return {kind:'g', g, mode:'GRAMMAR', prompt:g.sentence.replace('___', BLANK),
          opts, retry:!!retry, id:g.id};
}

function explain(target, chosenId){
  const n = target.confusions.find(c => c.id === chosenId);
  if(n) return n.note;
  const c = BY[chosenId];
  return c ? `고른 '${c.term}'은(는) ${c.meaningKo}. 정답 '${target.term}'은(는) ${target.meaningKo}.`
           : `정답 '${target.term}'은(는) ${target.meaningKo}.`;
}
const explainG = (g, chosen) => g.notes[chosen] || `정답은 '${g.answer}'입니다. ${g.tip}`;
const scoreFor = s => 10 + Math.min(Math.max(s-1,0),5)*2;

function record(k, ok, chosen){
  const cur = P.items[k] || {};
  const box = !ok ? 1 : Math.min((cur.box || 1) + 1, 5);
  P.items[k] = {
    box,
    due: Date.now() + GAP[box],
    n: (cur.n || 0) + 1,                       // 총 시도
    w: (cur.w || 0) + (ok ? 0 : 1),            // 틀린 횟수
    lw: ok ? (cur.lw || null) : chosen         // 마지막으로 고른 오답
  };
  saveP(P);
}

/* ---------- 상태 ---------- */
let S = {screen:'home'};
let LIB = {tab:'weak', level:0, q:''};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');

function start(){
  const nG = PICK.cat === 'grammar' ? SIZE : PICK.cat === 'word' ? 0 : 3;
  const nW = SIZE - nG;

  const ws = nW ? pickPool(WORDS, 'w', nW) : [];
  const gs = nG ? pickPool(GRAMMAR, 'g', nG) : [];

  const qs = shuffle([
    ...ws.map(w => build(w, modeFor(P.items[w.id] ? P.items[w.id].box : 0))),
    ...gs.map(g => buildG(g))
  ]);

  if(!qs.length){ toast('선택한 조건에 해당하는 문제가 없습니다. 레벨이나 분류를 바꿔 보세요.', 3200); return; }

  const fresh = ws.filter(w => !P.items[w.id]);   // 새 단어만 카드로 먼저 본다
  S = {screen: fresh.length ? 'study' : 'quiz', deck:fresh, si:0, qs, i:0,
       score:0, streak:0, best:0, right:0, fb:null, wrong:[]};
  render();
}

function answer(id){
  if(S.fb) return;
  const q = S.qs[S.i];
  const correct = q.kind === 'g' ? q.g.answer : q.w.id;
  const ok = id === correct;

  S.streak = ok ? S.streak + 1 : 0;
  S.best = Math.max(S.best, S.streak);
  const gain = (ok && !q.retry) ? scoreFor(S.streak) : 0;   // 재도전은 무득점
  S.score += gain;
  if(ok) S.right++; else S.wrong.push(q);

  S.fb = {ok, chosen:id, gain,
          why: ok ? '' : (q.kind === 'g' ? explainG(q.g, id) : explain(q.w, id))};
  record(key(q), ok, id);
  render();
  TTS.say(q.kind === 'g' ? q.g.full : q.w.term);
}

function next(){
  const q = S.qs[S.i];
  if(S.fb && !S.fb.ok && !q.retry){
    // 틀리면 세션 안에서 한 번 더. 단어는 쉬운 형식으로 낮춘다.
    S.qs.push(q.kind === 'g' ? buildG(q.g, true) : build(q.w, 'MEANING', true));
  }
  S.fb = null;
  if(S.i + 1 >= S.qs.length){
    P.total += S.score; P.best = Math.max(P.best, S.best); saveP(P);
    S.screen = 'result';
  } else S.i++;
  render();
}

function setPick(field, value){
  PICK[field] = value;
  if(field === 'track') PICK.level = 0;   // 세부 분야는 직장인 트랙에만 있다
  render();
}

/* ---------- 화면 ---------- */
function render(){
  try{ speechSynthesis.cancel(); }catch(e){}
  app.innerHTML = ({home:home, study:study, quiz:quiz, result:result, library:library})[S.screen]();
  window.scrollTo(0,0);
  if(S.screen === 'library') libFilter();
}

  return `<div class="notice">이 화면에서는 브라우저 음성 기능이 차단돼 있습니다.
    파일을 내려받아 <b>Chrome</b> 또는 <b>삼성 인터넷</b>에서 열면 발음이 나옵니다.
    발음 없이도 학습은 그대로 진행됩니다.</div>`;
}

function home(){
  const now = Date.now();
  const T = TRACK(PICK.track);
  const tw = WORDS.filter(w => w.track === T.id), tg = GRAMMAR.filter(g => g.track === T.id);
  const mine = [...tw.map(w => w.id), ...tg.map(g => 'g:' + g.id)].map(k => P.items[k]).filter(Boolean);
  const dueAll = mine.filter(v => v.due <= now).length;
  const seen = mine.length;
  const mastered = mine.filter(v => v.box >= 5).length;

  const lvCount = l => tw.filter(w => l===0 || w.level===l).length;
  const gCount  = l => tg.filter(g => l===0 || g.level===l).length;
  const trChip = t => `<button class="chip ${PICK.track===t.id?'on':''}" onclick="setPick('track','${t.id}')">
      ${t.emoji} ${t.name}<small>단어 ${WORDS.filter(w=>w.track===t.id).length} · 문법 ${GRAMMAR.filter(g=>g.track===t.id).length}</small></button>`;
  const levels = () => T.id === 'work' ? `
  <div class="label">분야</div>
  <div class="chips">
    ${lvChip(0,'전체')}${lvChip(1,'기초 업무')}
  </div>
  <div class="chips">
    ${lvChip(2,'회의·프로젝트')}${lvChip(3,'재무·법무')}
  </div>` : '';

  const lvChip = (l, name) => `<button class="chip ${PICK.level===l?'on':''}" onclick="setPick('level',${l})">
      ${name}<small>단어 ${lvCount(l)} · 문법 ${gCount(l)}</small></button>`;
  const catChip = (c, name, desc) => `<button class="chip ${PICK.cat===c?'on':''}" onclick="setPick('cat','${c}')">
      ${name}<small>${desc}</small></button>`;

  return `
  <h1>Biz Vocab Quest</h1>
  <div class="sub">${T.emoji} ${T.name} · ${T.sub}</div>

  <div class="label">누가 공부하나요?</div>
  <div class="chips">${TRACKS.slice(0,4).map(trChip).join('')}</div>
  <div class="chips">${TRACKS.slice(4).map(trChip).join('')}</div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b style="color:var(--indigo)">${P.total}</b><span>누적 점수</span></div>
      <div class="stat"><b style="color:var(--amber)">${P.best}</b><span>최고 연속</span></div>
      <div class="stat"><b style="color:var(--ok)">${mastered}</b><span>완전 습득</span></div>
    </div>
    <p style="margin:16px 0 0; font-size:14px; color:var(--muted)">
      ${T.name} ${tw.length}단어 · 문법 ${tg.length}문항 중 ${seen}개 학습 시작${dueAll ? ` · 복습 대기 ${dueAll}개` : ''}</p>
  </div>

  ${levels()}

  <div class="label">문제 유형</div>
  <div class="chips">
    ${catChip('word','단어','뜻·인출·빈칸')}
    ${catChip('grammar','문법','빈칸 채우기')}
    ${catChip('mix','섞어서','단어 7 + 문법 3')}
  </div>

  <button class="primary" onclick="start()">10문제 시작</button>
  <button class="ghost" onclick="openLibrary()">📒 학습 노트 · 약점 확인</button>
  <button class="install" id="installBtn" style="display:${deferredPrompt ? 'block' : 'none'}" onclick="installApp()">📲 홈 화면에 추가</button>
  <button class="diag" onclick="TTS.diagnose()">🔊 음성 테스트 · 안 들리면 눌러 보세요</button>
  ${ttsNotice()}

  <div class="notice"><b>진행 방식</b><br>
    새 단어는 카드로 먼저 보고, 익숙해질수록 문제가 어려워집니다(뜻 → 영어 인출 → 문장 빈칸).
    문법은 한국어 화자가 실제로 자주 틀리는 오답을 보기로 넣었습니다.
    틀린 문제는 세션 안에서 다시 나오고, 며칠 뒤 복습 대상으로 돌아옵니다.</div>

  <button class="link" onclick="if(confirm('학습 기록을 모두 지웁니다.')){P={items:{},total:0,best:0};saveP(P);render();}"
    style="display:block;margin:14px auto 0">학습 기록 초기화</button>`;

function quiz(){
  const q = S.qs[S.i], fb = S.fb, reveal = !!fb;
  const isG = q.kind === 'g';
  const w = isG ? null : q.w, g = isG ? q.g : null;
  const correctId = isG ? g.answer : w.id;
  const canSpeak = isG ? reveal : (q.mode !== 'RECALL' || reveal);   // 정답 유출 방지

  const opts = q.opts.map(o => {
    let cls = '', mark = '';
    if(fb){
      if(o.id === correctId){ cls = 'correct'; mark = '✓'; }
      else if(o.id === fb.chosen){ cls = 'wrong'; mark = '✕'; }
      else cls = 'dim';
    }
    const safe = o.id.replace(/'/g, "\\'");
    return `<button class="opt ${cls}" onclick="answer('${safe}')">
      <span>${esc(o.label)}</span><span class="mark" style="color:${cls==='correct'?'var(--ok)':'var(--no)'}">${mark}</span></button>`;
  }).join('');

  const head = isG
    ? `<div class="topic">${esc(g.topic)}</div>
       <div class="prompt" style="margin-top:12px">${esc(q.prompt)}</div>`
    : q.mode === 'MEANING'
      ? `${emojiOf(w)}<div class="term">${esc(w.term)}</div>${ipaOf(w) ? `<div style="margin-top:10px">${ipaOf(w)}</div>` : ''}`
      : q.mode === 'RECALL'
        ? `${emojiOf(w)}<div class="prompt">${esc(w.meaningKo)}</div><div class="meta" style="margin-top:6px">${w.pos}</div>`
        : `<div class="prompt">${esc(q.prompt)}</div>${ipaOf(w) ? `<div style="margin-top:10px">${ipaOf(w)}</div>` : ''}`;

  const speakRow = !canSpeak ? '' : isG
    ? `<div style="margin-top:14px"><button class="speak" onclick="event.stopPropagation();TTS.say(GB['${g.id}'].full, this)">🔊 완성 문장</button></div>`
    : `<div style="margin-top:14px">
         <button class="speak" onclick="event.stopPropagation();TTS.say(BY['${w.id}'].term, this)">🔊 단어</button>
         ${(q.mode !== 'CLOZE' || reveal) ? `<button class="speak" onclick="event.stopPropagation();TTS.say(BY['${w.id}'].example, this)">🔊 예문</button>` : ''}
       </div>`;

  const fbBody = !fb ? '' : isG
    ? `${fb.ok ? '' : `<p>${esc(fb.why)}</p>`}
       <p style="margin-top:14px;font-weight:700">${esc(g.full)}</p>
       <p class="ko" style="margin-top:2px">${esc(g.ko)}</p>
       <div class="tip">${esc(g.tip)}</div>
       <div style="margin-top:12px">
         <button class="speak" onclick="TTS.say(GB['${g.id}'].full, this)">🔊 완성 문장</button></div>`
    : `${fb.ok ? '' : `<p>${esc(fb.why)}</p>`}
       <p style="margin-top:14px"><b style="font-size:20px;color:var(--indigo)">${esc(w.term)}</b>
         ${ipaOf(w,"margin-left:8px")}</p>
       <p style="margin-top:4px">${esc(w.meaningKo)}</p>
       <p style="font-weight:600">${esc(w.example)}</p>
       <p class="ko" style="margin-top:2px">${esc(w.exampleKo)}</p>
       <div style="margin-top:10px">
         <button class="speak" onclick="TTS.say(BY['${w.id}'].term, this)">🔊 단어</button>
         <button class="speak" onclick="TTS.say(BY['${w.id}'].example, this)">🔊 예문</button></div>`;

  const fbHtml = !fb ? '' : `
    <div class="fb ${fb.ok?'ok':'no'}">
      <div class="row" style="justify-content:flex-start">
        <h3 class="${fb.ok?'ok':'no'}">${fb.ok?'정답':'오답'}</h3>
        ${fb.gain ? `<span class="plus">+${fb.gain}점</span>` : ''}
      </div>${fbBody}
    </div>
    <button class="primary" onclick="next()">${S.i+1 >= S.qs.length ? '결과 보기' : '다음 문제'}</button>`;

  const cardTap = canSpeak
    ? (isG ? `onclick="TTS.say(GB['${g.id}'].full)"` : `onclick="TTS.say(BY['${w.id}'].term)"`)
    : '';

  return `
  <div class="qhead">
    <div class="row">
      <span class="meta">문제 ${S.i+1} / ${S.qs.length}</span>
      <span class="sc">
        <span><em>점수</em><b style="color:var(--indigo)">${S.score}</b></span>
        <span><em>연속</em><b class="fire">${S.streak}${S.streak?'🔥':''}</b></span>
      </span>
    </div>
    <div class="bar"><i style="width:${(S.i / S.qs.length * 100).toFixed(1)}%"></i></div>
  </div>
  <div class="card" style="margin-top:18px" ${cardTap}>
    <div class="meta" style="color:${q.retry?'var(--no)':'var(--muted)'};margin-bottom:10px">
      ${q.retry ? '다시 도전 · ' : ''}${MODE_KO[q.mode]}</div>
    ${head}${speakRow}
  </div>
  ${opts}${fbHtml}`;
}

function result(){
  const acc = S.qs.length ? Math.round(S.right / S.qs.length * 100) : 0;
  const uniq = [...new Map(S.wrong.map(q=>[q.kind+q.id, q])).values()];
  const title = acc >= 90 ? '완벽합니다' : acc >= 70 ? '잘하고 있습니다' : '복습이 필요합니다';

  const item = q => q.kind === 'g'
    ? `<div class="wrongitem">
         <span class="topic">${esc(q.g.topic)}</span>
         <div style="margin-top:8px;font-size:16px;font-weight:700">${esc(q.g.full)}</div>
         <div style="margin-top:4px;font-size:14px;color:var(--muted)">${esc(q.g.ko)}</div>
         <div class="tip">${esc(q.g.tip)}</div>
         <button class="speak" onclick="TTS.say(GB['${q.g.id}'].full, this)">🔊 문장</button>
       </div>`
    : `<div class="wrongitem">
         <b>${esc(q.w.term)}</b> ${ipaOf(q.w,"margin-left:8px")}
         <div style="margin-top:6px;font-size:16px">${esc(q.w.meaningKo)}</div>
         <div style="margin-top:8px;font-size:15px;color:var(--muted);line-height:1.6">${esc(q.w.example)}</div>
         <button class="speak" onclick="TTS.say(BY['${q.w.id}'].term, this)">🔊 발음</button>
       </div>`;

  return `
  <h1 style="color:${acc>=70?'var(--ok)':'var(--amber)'}">${title}</h1>
  <div class="card" style="margin-top:16px">
    <div class="stats">
      <div class="stat"><b style="color:var(--indigo)">${S.score}</b><span>획득 점수</span></div>
      <div class="stat"><b style="color:var(--ok)">${acc}%</b><span>정답률</span></div>
      <div class="stat"><b style="color:var(--amber)">${S.best}</b><span>최고 연속</span></div>
    </div>
  </div>
  ${uniq.length ? `<h3 style="margin:24px 0 2px;font-size:19px">다시 볼 문제 ${uniq.length}개</h3>
    <div class="meta" style="font-weight:400">며칠 뒤 복습 문제로 다시 나옵니다.</div>` : ''}
  ${uniq.map(item).join('')}
  <button class="primary" onclick="start()">한 세션 더</button>
  <button class="ghost" onclick="S={screen:'home'};render()">홈으로</button>`;
}

/* ---------- 약점 노트 / 전체 목록 ---------- */
const stat = k => P.items[k] || null;
const statusOf = st => !st ? ['b-new','미학습']
  : (st.w||0) >= 2 ? ['b-bad','약점']
  : st.box >= 5 ? ['b-ok','습득']
  : ['b-go','학습중'];

function wordItem(w){
  const st = stat(w.id), sv = statusOf(st);
  const rate = st && st.n ? ` · ${st.n - (st.w||0)}/${st.n}` : '';
  const conf = st && st.lw ? (w.confusions.find(c => c.id === st.lw) || {}).note : null;
  return `<div class="item" data-lv="${w.level}" data-s="${esc((w.term + ' ' + w.meaningKo).toLowerCase())}">
    <div class="top"><b>${esc(w.term)}</b><span class="badge ${sv[0]}">${sv[1]}${rate}</span></div>
    ${ipaOf(w) ? `<div style="margin-top:6px">${ipaOf(w)}</div>` : ''}
    <div class="ko">${esc(w.meaningKo)}</div>
    <div class="ex">${esc(w.example)}</div>
    ${conf ? `<div class="tip">자주 헷갈린 짝 — ${esc(conf)}</div>` : ''}
    <button class="miniSpeak" onclick="TTS.say(BY['${w.id}'].term, this)">🔊 발음</button>
    <button class="miniSpeak" onclick="TTS.say(BY['${w.id}'].example, this)">🔊 예문</button>
  </div>`;
}

function gramItem(g){
  const st = stat('g:' + g.id), sv = statusOf(st);
  const rate = st && st.n ? ` · ${st.n - (st.w||0)}/${st.n}` : '';
  return `<div class="item" data-lv="${g.level}" data-s="${esc((g.topic + ' ' + g.full + ' ' + g.ko).toLowerCase())}">
    <div class="top"><span class="topic">${esc(g.topic)}</span><span class="badge ${sv[0]}">${sv[1]}${rate}</span></div>
    <div style="margin-top:10px;font-size:16px;font-weight:700">${esc(g.full)}</div>
    <div class="ex">${esc(g.ko)}</div>
    <div class="tip">${esc(g.tip)}</div>
    <button class="miniSpeak" onclick="TTS.say(GB['${g.id}'].full, this)">🔊 문장</button>
  </div>`;
}

function openLibrary(){ LIB = {tab:'weak', level:0, q:''}; S = {screen:'library'}; render(); }
function libTab(t){ LIB.tab = t; LIB.level = 0; LIB.q = ''; render(); }

function library(){
  const T = TRACK(PICK.track);
  const WORDS_T = WORDS.filter(w => w.track === T.id), GRAMMAR_T = GRAMMAR.filter(g => g.track === T.id);
  const tab = (t, name) => `<button class="tab ${LIB.tab===t?'on':''}" onclick="libTab('${t}')">${name}</button>`;
  const lvBtn = l => `<button class="chip ${LIB.level===l?'on':''}" data-l="${l}" onclick="setLibLevel(${l})">${l===0?'전체':LEVEL_KO[l]}</button>`;

  let body;
  if(LIB.tab === 'weak'){
    // 많이 틀린 순 → 아직 안 잡힌 순
    const ws = WORDS_T.filter(w => (stat(w.id)||{}).w > 0)
      .sort((a,b) => (stat(b.id).w - stat(a.id).w) || (stat(a.id).box - stat(b.id).box));
    const gs = GRAMMAR_T.filter(g => (stat('g:'+g.id)||{}).w > 0)
      .sort((a,b) => stat('g:'+b.id).w - stat('g:'+a.id).w);
    body = (ws.length || gs.length)
      ? ws.map(wordItem).join('') + gs.map(gramItem).join('')
      : `<div class="empty">아직 틀린 문제가 없습니다.<br>퀴즈를 몇 번 풀고 나면<br>자주 틀리는 것만 여기 모입니다.</div>`;
  } else if(LIB.tab === 'words'){
    body = WORDS_T.map(wordItem).join('');
  } else {
    body = GRAMMAR_T.map(gramItem).join('');
  }

  const filter = LIB.tab === 'weak' ? '' : `
    <input class="search" placeholder="단어나 뜻으로 검색" oninput="libSearch(this.value)">
    ${T.id === 'work' ? `<div class="chips" id="libLevels">${lvBtn(0)}${lvBtn(1)}${lvBtn(2)}${lvBtn(3)}</div>` : ''}
    <div class="meta" style="margin-top:12px" id="libCount"></div>`;

  return `
  <div class="row">
    <h1 style="font-size:26px;margin:6px 0">학습 노트 · ${T.emoji} ${T.name}</h1>
    <button class="link" onclick="S={screen:'home'};render()">홈으로</button>
  </div>
  <div class="tabs">${tab('weak','약점 노트')}${tab('words','단어 '+WORDS_T.length)}${tab('grammar','문법 '+GRAMMAR_T.length)}</div>
  ${filter}
  <div id="libList">${body}</div>
  <div style="height:24px"></div>`;
}

// 필터는 화면을 다시 그리지 않고 DOM만 숨긴다. 다시 그리면 검색창 포커스가 날아간다.
function libFilter(){
  const rows = document.querySelectorAll('#libList > .item');
  let n = 0;
  rows.forEach(r => {
    const okLv = LIB.level === 0 || Number(r.dataset.lv) === LIB.level;
    const okQ  = !LIB.q || (r.dataset.s || '').indexOf(LIB.q) >= 0;
    const show = okLv && okQ;
    r.style.display = show ? '' : 'none';
    if(show) n++;
  });
  const c = document.getElementById('libCount');
  if(c) c.textContent = n + '개';
}
function libSearch(v){ LIB.q = (v || '').toLowerCase().trim(); libFilter(); }
function setLibLevel(l){
  LIB.level = l;
  document.querySelectorAll('#libLevels .chip').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.l) === l));
  libFilter();
}

/* ---------- 홈 화면 설치 / 오프라인 ---------- */
let deferredPrompt = null;

if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator
   && typeof location !== 'undefined' && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW 등록 실패', e));
  });
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById('installBtn');
  if(b) b.style.display = 'block';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  toast('홈 화면에 추가됐습니다. 이제 아이콘으로 바로 열 수 있습니다.', 3600);
});

async function installApp(){
  if(!deferredPrompt){
    toast('브라우저 메뉴(⋮)에서 "홈 화면에 추가"를 눌러 주세요.', 4200);
    return;
  }
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt = null;
}

render();
</script>
</body>
</html>
